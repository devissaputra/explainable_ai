<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675">
<rect width="1200" height="675" fill="#f8fafc"/>
<text x="60" y="75" font-family="Arial" font-size="34" font-weight="700" fill="#0f172a">Model Discrimination & Interpretation</text>
<text x="60" y="112" font-family="Arial" font-size="19" fill="#64748b">The model is strong at ranking held-out cases, while permutation importance explains which features affect that performance.</text>
<rect x="65" y="175" width="610" height="390" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="105" y="220" font-family="Arial" font-size="23" font-weight="700" fill="#1e40af">ROC curve</text>
<line x1="135" y1="500" x2="610" y2="500" stroke="#64748b" stroke-width="2"/><line x1="135" y1="500" x2="135" y2="265" stroke="#64748b" stroke-width="2"/>
<line x1="135" y1="500" x2="610" y2="265" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="8 7"/>
<polyline points="135,500 150,390 165,335 185,300 220,280 280,270 360,265 470,262 610,260" fill="none" stroke="#2563eb" stroke-width="6"/>
<text x="372" y="545" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">False positive rate</text>
<text x="115" y="265" text-anchor="end" font-family="Arial" font-size="18" fill="#64748b">TPR</text>
<text x="400" y="345" font-family="Arial" font-size="44" font-weight="700" fill="#0f172a">AUC 0.9945</text>

<rect x="735" y="175" width="400" height="390" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="775" y="220" font-family="Arial" font-size="23" font-weight="700" fill="#166534">What XAI tells us</text>
<text x="775" y="285" font-family="Arial" font-size="20" fill="#334155">✓ which features the model uses</text>
<text x="775" y="330" font-family="Arial" font-size="20" fill="#334155">✓ how strongly score changes</text>
<text x="775" y="375" font-family="Arial" font-size="20" fill="#334155">✓ variability across permutation repeats</text>
<text x="775" y="435" font-family="Arial" font-size="20" fill="#991b1b">✗ not causal effect</text>
<text x="775" y="475" font-family="Arial" font-size="20" fill="#991b1b">✗ not clinical justification</text>
<text x="775" y="515" font-family="Arial" font-size="20" fill="#991b1b">✗ not individual explanation</text>
</svg>